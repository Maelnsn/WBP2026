<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <title>Formulaire Contact</title>
        <link rel="stylesheet" href="normalize.css">
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <header id="header">
            <h1>Formulaire de Contact</h1>
        </header>

        <main>
            <form id="formulaire" method="post" action="traitement">
                
                <div class="form1">
                    <p>
                        <label  for="nom">Nom</label>
                        <input  type="text" id="nom" name="nom" placeholder="Entrez votre nom"
                                minlength="2" maxlength="26" required>
                    </p>
                    <p>
                        <label  for="prenom">Prenom</label>
                        <input  type="text" id="prenom" name="prenom" placeholder="Entrez votre prenom"
                                minlength="2" maxlength="30" required>
                    </p>
                </div>
                <div class="form2">
                    <p>
                        <label  for="adress">Adresse</label>
                        <input  type="text" id="adress" name="adress" placeholder="Votre adresse"
                                size="30" maxlength="50">
                    </p>
                </div>
                
            </form>
        </main>
        <footer></footer>
    </body>
</html>
