<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <title>Formulaire Contact</title>
        <link rel="stylesheet" href="normalize.css">
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <header id="header">
            <h2>Formulaire de Contact</h2>
        </header>

        <main>
            <form id="formulaire" method="post" action="backend/traitement">
                
                <div class="form1">
                    <p>
                        <label  for="nom">Nom</label>
                        <input  type="text" id="nom" name="nom" placeholder="Entrez votre nom"
                                minlength="2" maxlength="26" required>
                    </p>
                    <p>
                        <label  for="prenom">Prenom</label>
                        <input  type="text" id="prenom" name="prenom" placeholder="Entrez votre prenom"
                                minlength="2" maxlength="30" required>
                    </p>
                </div>
                <div class="form2">
                    <label  for="adress">Adresse</label>
                    <input  type="text" id="adress" name="adress" placeholder="Votre adresse"
                            size="30" maxlength="50">
                </div>
                <div class="form3">
                    <label  for="description">Description</label>
                    <textarea   id="description" name="description" placeholder="Décrivez nous votre problème"
                                rows="10" columns="20" size="40" maxlength="200"></textarea>
                </div>
                <div>
                    <button class="bouton" type="submit">Envoyer</button> 
                </div>
                
            </form>
        </main>
        <footer></footer>
    </body>
</html>
